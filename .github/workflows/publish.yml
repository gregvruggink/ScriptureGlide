name: "publish"

on:
  push:
    branches:
      - main
      - beta

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
      # Opt into the newer Node.js runner to clear the warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both Intel and Apple Silicon targets for macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name == 'beta' && 'beta-v__VERSION__' || 'app-v__VERSION__' }}
          releaseName: ${{ github.ref_name == 'beta' && 'ScriptureGlide v__VERSION__ (Beta)' || 'ScriptureGlide v__VERSION__' }}
          releaseBody: ${{ github.ref_name == 'beta' && 'Automated beta build from GitHub Actions.' || 'Automated release from GitHub Actions.' }}
          releaseDraft: true
          prerelease: ${{ github.ref_name == 'beta' }}
          # Use the universal target for macOS builds
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
