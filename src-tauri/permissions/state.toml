[[permission]]
identifier = "state-commands"
description = "Permissions for state management commands"
commands.allow = [
  "get_state",
  "set_state",
  "open_presentation_window",
  "close_presentation_window",
  "list_monitors",
  "fetch_youversion",
  "fetch_url",
  "take_pending_open_files",
  "read_glide_file"
]
